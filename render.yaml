# Render Blueprint: one Docker web service (API + built web client) + Postgres.
# Render → New → Blueprint → select this repo.
databases:
  - name: oman-debates-db
    plan: basic-256mb
    databaseName: oman_debates
    postgresMajorVersion: "16"

services:
  - type: web
    name: oman-debates
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    # Deploy straight from this branch — no merge into main needed.
    branch: app-link
    healthCheckPath: /api/healthz
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: oman-debates-db
          property: connectionString
      # Render passes env vars to `docker build` as build args, so the
      # Clerk key is baked into the client bundle. Set it in the dashboard.
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
