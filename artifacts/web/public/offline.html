<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#4ECDC4" />
    <title>لا يوجد اتصال — مناظرات عُمان</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: #f7f7f9; color: #1a1a1a; font-family: Tahoma, Arial, sans-serif; text-align: center; }
      main { max-width: 420px; }
      img { border-radius: 24px; }
      h1 { font-size: 24px; margin-top: 24px; }
      p { line-height: 1.9; color: #666; }
      button { padding: 14px 24px; border: 0; border-radius: 12px; background: #7B2D8E; color: white; font: inherit; cursor: pointer; }
      button:focus-visible { outline: 3px solid #4ECDC4; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <h1>لا يوجد اتصال بالإنترنت</h1>
      <p>مناظرات عُمان يحتاج اتصالًا بالإنترنت لتسجيل الدخول وتحميل بيانات البطولات وحفظ الدرجات. أعد الاتصال ثم حاول مجددًا.</p>
      <button onclick="window.location.reload()">إعادة المحاولة</button>
    </main>
  </body>
</html>
